name: Idea or feature request
description: Something CrowdTune should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the feature. "At our wedding the DJ wanted..." is more useful than "add X".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: role
    attributes:
      label: Who would use it?
      options:
        - Guests
        - Hosts
        - Both
